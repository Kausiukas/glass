<!doctype html>
<!-- Overlay-mode test: a site-like page with its own background (a painted canvas); the WebGL canvas only adds the slab.
     Opens directly from disk. Rebuild overlay.js with npm run build after editing overlay.ts. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glass slab · overlay test</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Open+Sans:wght@700&display=swap">
<link rel="stylesheet" href="../src/glass/glass.css">
<style>
body{margin:0;font-family:Poppins,sans-serif;min-height:140vh}
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.wrap{position:relative;z-index:2;padding:90px clamp(16px,8vw,120px)}
.slab-body{display:grid;justify-items:center;gap:18px;text-align:center;padding:56px}
h1{margin:0;font:800 56px/1.1 Poppins,sans-serif;max-width:13em}
.cta{font:700 16px/1 'Open Sans',sans-serif;border-radius:16px;padding:17px 26px;border:0}
</style></head><body>
<canvas id="bg"></canvas>
<canvas id="gl" class="glass-canvas" aria-hidden="true"></canvas>
<div class="wrap"><div class="glass-host" id="host"><div class="glass-slab" id="slab"><div class="slab-body">
<h1 data-glass-carve>Overlay mode on a site background</h1>
<button class="cta" data-glass-button="1"><span data-glass-label>Start your journey free →</span></button>
</div></div></div></div>
<script>window.__errs=[];</script><script src="overlay.js"></script>
</body></html>
